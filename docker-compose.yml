version: "3.8"

services:
  # MongoDB
  mongo:
    image: mongo:7
    container_name: portfolio-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: portfolio
    ports:
      - "27017:27017"
    networks:
      - portfolio-network

  # Backend API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/portfolio
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CLIENT_URL=${CLIENT_URL}
    depends_on:
      - mongo
    networks:
      - portfolio-network

  # Frontend (built static files served by nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: portfolio-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - portfolio-network

volumes:
  mongo_data:
    driver: local

networks:
  portfolio-network:
    driver: bridge
